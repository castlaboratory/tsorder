# Q5 — CPU cost per series by estimator family (median of 20 series, log-log in n).

[run]
name = "q5"
out = "benchmark/results/q5"
n = [50, 100, 200, 400, 800, 1600, 3200, 10000, 30000, 100000]
replications = 1
timing = true
timing_series = 20

[[dgp]]
name = "ar2_strong"
phi = [1.2, -0.6]
true_order = 2

[[estimator]]
name = "bic_yw"
kind = "ic"
criterion = "bic"

[[estimator]]
name = "bic_ols"
kind = "ic"
criterion = "bic"
method = "ols"

[[estimator]]
name = "bic_burg"
kind = "ic"
criterion = "bic"
method = "burg"

[[estimator]]
name = "pacf_bic15"
kind = "fh"
statistic = "pacf"
threshold = "bic"
c = 1.5

[[estimator]]
name = "jirak_gumbel05"
kind = "fh"
statistic = "jirak_band"
threshold = "gumbel"
alpha = 0.05

[[estimator]]
name = "inverse_pacf_bic15"
kind = "fh"
statistic = "inverse_pacf"
threshold = "bic"
c = 1.5

[[estimator]]
name = "pacf_robust"
kind = "fh"
statistic = "pacf_robust"
threshold = "bic"
c = 1.5

[[estimator]]
name = "ens_majority"
kind = "ensemble"
statistics = ["pacf", "long_ar_ols", "acf_bartlett"]
rule = "majority"
threshold = "bic"
c = 1.5
