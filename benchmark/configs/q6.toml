# Q6 — infinite order: one-step-ahead prediction of the selected model,
# AIC-type vs threshold estimators (Yang 2005's trade-off in numbers).
# ma1_inf has AR(inf) representation; arfima03 has long memory (generation
# is O(n * 1000), capped at n = 1600); ar2_strong is the finite-order control.

[run]
name = "q6"
out = "benchmark/results/q6"
n = [50, 100, 200, 400, 800, 1600, 3200, 10000]
replications = 2000
replications_large = 1000
large_from = 3200
predict = true

[[dgp]]
name = "ma1_inf"
theta = [0.5]

[[dgp]]
name = "arfima03"
arfima_d = 0.3
max_n = 1600

[[dgp]]
name = "ar2_strong"
phi = [1.2, -0.6]
true_order = 2

[[estimator]]
name = "aic_yw"
kind = "ic"
criterion = "aic"

[[estimator]]
name = "aicc_yw"
kind = "ic"
criterion = "aicc"

[[estimator]]
name = "bic_yw"
kind = "ic"
criterion = "bic"

[[estimator]]
name = "hq_yw"
kind = "ic"
criterion = "hq"

[[estimator]]
name = "pacf_bic15"
kind = "fh"
statistic = "pacf"
threshold = "bic"
c = 1.5

[[estimator]]
name = "pacf_fixed196"
kind = "fh"
statistic = "pacf"
threshold = "fixed"
c = 1.96

[[estimator]]
name = "pacf_gumbel05"
kind = "fh"
statistic = "pacf"
threshold = "gumbel"
alpha = 0.05
