# Q2 — ensemble (majority/median over {pacf, long_ar_ols, acf_bartlett})
# vs its best member vs BIC. Decides whether the ensemble stays.

[run]
name = "q2"
out = "benchmark/results/q2"
n = [50, 100, 200, 400, 800, 1600, 3200, 10000]
replications = 2000
replications_large = 1000
large_from = 3200

[[dgp]]
name = "wn"
true_order = 0

[[dgp]]
name = "ar1_05"
phi = [0.5]
true_order = 1

[[dgp]]
name = "ar2_strong"
phi = [1.2, -0.6]
true_order = 2

[[dgp]]
name = "ar4_subset"
phi = [0.5, 0.0, 0.0, 0.3]
true_order = 4

[[dgp]]
name = "ma1"
theta = [0.5]
true_order = 1

[[dgp]]
name = "ma2"
theta = [0.6, 0.3]
true_order = 2

[[dgp]]
name = "ar2_outliers"
phi = [1.2, -0.6]
outlier_prob = 0.05
outlier_sd = 5.0
true_order = 2

[[estimator]]
name = "ens_majority"
kind = "ensemble"
statistics = ["pacf", "long_ar_ols", "acf_bartlett"]
rule = "majority"
threshold = "bic"
c = 1.5

[[estimator]]
name = "ens_median"
kind = "ensemble"
statistics = ["pacf", "long_ar_ols", "acf_bartlett"]
rule = "median"
threshold = "bic"
c = 1.5

[[estimator]]
name = "pacf_bic15"
kind = "fh"
statistic = "pacf"
threshold = "bic"
c = 1.5

[[estimator]]
name = "long_ar_ols_bic15"
kind = "fh"
statistic = "long_ar_ols"
threshold = "bic"
c = 1.5

[[estimator]]
name = "acf_bartlett_bic15"
kind = "fh"
statistic = "acf_bartlett"
threshold = "bic"
c = 1.5

[[estimator]]
name = "bic_yw"
kind = "ic"
criterion = "bic"
