name: pages

# Publishes the static landing page in site/ and the API reference (rustdoc)
# under /api to GitHub Pages on every push to main. Pages must be set to
# "GitHub Actions" as its source (Settings → Pages).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: API reference
        run: |
          cargo doc --workspace --no-deps
          rm -rf site/api
          cp -R target/doc site/api
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: bindings/r
          extra-packages: any::pkgdown, local::.
      - name: pkgdown site
        run: |
          Rscript -e 'pkgdown::build_site("bindings/r", preview = FALSE)'
          rm -rf site/r
          cp -R bindings/r/docs site/r
      - name: Disable Jekyll
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
